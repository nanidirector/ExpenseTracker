
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>
    

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Your own CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">
        <h1 class="text-center">Expense Tracker</h1>
        <p class="text-center text-muted">
            Manage your income and expenses easily.
        </p>
        <h2 class="text-center">Add Transaction</h2>
        <div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="bg-success text-white p-3 rounded text-center">
      <h5>Income</h5>
      <p id="total-income" class="fs-4 mb-0">₹0.00</p>
    </div>
  </div>
  <div class="col-md-4">
    <div class="bg-danger text-white p-3 rounded text-center">
      <h5>Expense</h5>
      <p id="total-expense" class="fs-4 mb-0">₹0.00</p>
    </div>
  </div>
  <div class="col-md-4">
    <div class="bg-primary text-white p-3 rounded text-center">
      <h5>Balance</h5>
      <p id="total-balance" class="fs-4 mb-0">₹0.00</p>
    </div>
  </div>
</div>
        <form id="transaction-form">
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control" id="description" placeholder="Enter description" required>
        </div>
        <div class="mb-3">
            <label for="amount" class="form-label">Amount (₹)</label>
            <input type="number" class="form-control" id="amount" placeholder="Enter amount" required step="0.01" min="0">
        </div>
<div class="mb-3">
  <label for="category" class="form-label">Category</label>
  <select class="form-select" id="category" required>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Shopping">Shopping</option>
    <option value="Bills">Bills</option>
    <option value="Other">Other</option>
  </select>
</div>
<div class="mb-3">
  <label for="type" class="form-label">Type</label>
  <select class="form-select" id="type" required>
    <option value="expense">Expense</option>
    <option value="income">Income</option>
  </select>
</div>
        <button type="submit" class="btn btn-primary">Add Transaction</button>
    </form>
    <div class="mt-5">
  <h3 class="mb-3">Transactions</h3>
  <ul id="transaction-list" class="list-group"></ul>
</div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your own JavaScript -->
    <script src="script.js"></script>
    

</body>

</html>
